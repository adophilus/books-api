<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex">
        <a routerLink="/" class="flex items-center gap-2 text-indigo-600 font-bold text-xl">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
          Book API
        </a>
        <div class="hidden sm:flex sm:ml-8 sm:space-x-1">
          <a routerLink="/"
             routerLinkActive="bg-gray-100 text-gray-900"
             [routerLinkActiveOptions]="{exact: true}"
             class="text-gray-600 hover:text-gray-900 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium transition-colors">
            Dashboard
          </a>
          <a routerLink="/authors"
             routerLinkActive="bg-gray-100 text-gray-900"
             class="text-gray-600 hover:text-gray-900 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium transition-colors">
            Authors
          </a>
          <a routerLink="/books"
             routerLinkActive="bg-gray-100 text-gray-900"
             class="text-gray-600 hover:text-gray-900 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium transition-colors">
            Books
          </a>
          <a routerLink="/videos"
             routerLinkActive="bg-gray-100 text-gray-900"
             class="text-gray-600 hover:text-gray-900 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium transition-colors">
            Videos
          </a>
        </div>
      </div>

      <div class="flex items-center">
        <div class="relative">
          <button (click)="toggleDropdown()"
                  class="flex items-center gap-2 text-sm text-gray-700 hover:text-gray-900 bg-gray-50 hover:bg-gray-100 px-3 py-2 rounded-lg transition-colors">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            @if (selectedAuthorName()) {
              <span>{{ selectedAuthorName() }}</span>
            } @else {
              <span class="text-gray-400">Select author...</span>
            }
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          @if (showDropdown()) {
            <div class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-gray-200 py-1 z-50 max-h-64 overflow-y-auto">
              @for (author of authors(); track author.id) {
                <button (click)="selectAuthor(author)"
                        [class.bg-indigo-50]="author.id === selectedAuthorId()"
                        class="w-full text-left px-4 py-2 text-sm hover:bg-gray-50 flex items-center justify-between">
                  <span>{{ author.name }}</span>
                  @if (author.id === selectedAuthorId()) {
                    <svg class="w-4 h-4 text-indigo-600" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                    </svg>
                  }
                </button>
              }
            </div>
          }
        </div>
      </div>
    </div>

    <!-- Mobile nav -->
    <div class="sm:hidden flex space-x-1 pb-2 -mt-1">
      <a routerLink="/" routerLinkActive="bg-gray-100 text-gray-900" [routerLinkActiveOptions]="{exact: true}"
         class="text-gray-600 hover:bg-gray-50 px-3 py-1.5 rounded-md text-sm font-medium">Dashboard</a>
      <a routerLink="/authors" routerLinkActive="bg-gray-100 text-gray-900"
         class="text-gray-600 hover:bg-gray-50 px-3 py-1.5 rounded-md text-sm font-medium">Authors</a>
      <a routerLink="/books" routerLinkActive="bg-gray-100 text-gray-900"
         class="text-gray-600 hover:bg-gray-50 px-3 py-1.5 rounded-md text-sm font-medium">Books</a>
      <a routerLink="/videos" routerLinkActive="bg-gray-100 text-gray-900"
         class="text-gray-600 hover:bg-gray-50 px-3 py-1.5 rounded-md text-sm font-medium">Videos</a>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <router-outlet />
</main>
