<div>
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <h1 class="text-2xl font-bold text-gray-900">
      <i class="fas fa-users mr-2 text-indigo-500"></i> Authors
    </h1>
    <button (click)="handleCreate()"
      class="inline-flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors text-sm font-medium">
      <i class="fas fa-plus"></i> Add Author
    </button>
  </div>

  @if (isLoading) {
    <div class="flex items-center justify-center py-12">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
    </div>
  }

  @if (!isLoading && hasError) {
    <app-generic-error [message]="errorMessage"></app-generic-error>
  }

  @if (!isLoading && !hasError) {
    <app-authors-datatable
      [items]="items"
      [isLoading]="false"
      [hasError]="false"
      (create)="handleCreate()"
      (view)="handleView($event)"
      (update)="handleUpdate($event)"
      (delete)="handleDelete($event)"
    ></app-authors-datatable>

    <div class="flex justify-end mt-4">
      <app-generic-paginator
        [currentPage]="page"
        [totalPages]="totalPages"
        [maxVisible]="5"
        [totalItems]="totalItems"
        [itemsPerPage]="limit"
        (pageChange)="onPageChange($event)"
      ></app-generic-paginator>
    </div>
  }
</div>
