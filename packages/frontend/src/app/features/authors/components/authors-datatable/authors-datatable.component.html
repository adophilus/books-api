<app-generic-datatable
  [items]="items"
  [columns]="datatableColumns"
  [isLoading]="isLoading"
  [hasError]="hasError"
  [showCreateButton]="true"
  emptyIcon="fas fa-users"
  emptyTitle="No authors found"
  emptySubtitle="Add the first author"
  createLabel="Add Author"
  (create)="create.emit()"
  (view)="view.emit($event)"
  (update)="update.emit($event)"
  (delete)="delete.emit($event)"
></app-generic-datatable>
