@if (isLoading) {
  <div class="flex items-center justify-center py-12">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
  </div>
} @else if (bookView) {
  <div class="space-y-6">
    <button (click)="onBack()" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700">
      <i class="fas fa-arrow-left"></i> Back to Book Views
    </button>

    <div class="bg-white rounded-xl border border-gray-200 p-6">
      <h1 class="text-2xl font-bold text-gray-900 mb-4">Book View Details</h1>
      <div class="space-y-2">
        <p><span class="text-gray-500">Code:</span> {{ bookView.code }}</p>
        <p><span class="text-gray-500">Book ID:</span> {{ bookView.bookId }}</p>
        <p><span class="text-gray-500">Author ID:</span> {{ bookView.authorId }}</p>
        <p><span class="text-gray-500">Created:</span> {{ bookView.createdAt | date }}</p>
      </div>
    </div>
  </div>
}
