@if (isLoading) {
  <div class="flex items-center justify-center py-12">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
  </div>
} @else if (comment) {
  <div class="space-y-6">
    <button (click)="onBack()" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700">
      <i class="fas fa-arrow-left"></i> Back to Video Comments
    </button>

    <div class="bg-white rounded-xl border border-gray-200 p-6">
      <h1 class="text-2xl font-bold text-gray-900 mb-4">Comment Details</h1>
      <div class="space-y-2">
        <p><span class="text-gray-500">Code:</span> {{ comment.code }}</p>
        <p><span class="text-gray-500">Video ID:</span> {{ comment.videoId }}</p>
        <p><span class="text-gray-500">Author ID:</span> {{ comment.authorId }}</p>
        <div class="mt-4 p-4 bg-gray-50 rounded-lg">
          <p class="text-gray-700">{{ comment.content }}</p>
        </div>
        <p><span class="text-gray-500">Created:</span> {{ comment.createdAt | date }}</p>
      </div>
      <div class="mt-4 flex gap-2">
        <button (click)="onEdit()" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium">
          <i class="fas fa-edit mr-1"></i> Edit
        </button>
      </div>
    </div>
  </div>
}
