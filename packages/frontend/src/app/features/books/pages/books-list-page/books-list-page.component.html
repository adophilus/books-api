<div>
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <h1 class="text-2xl font-bold text-gray-900">
      <i class="fas fa-book mr-2 text-indigo-500"></i> Books
    </h1>
    <button (click)="goToCreate()"
      class="inline-flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors text-sm font-medium">
      <i class="fas fa-plus"></i> Add Book
    </button>
  </div>

  @if (loading) {
    <div class="flex items-center justify-center py-12">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
    </div>
  }

  @if (!loading && error) {
    <app-generic-error message="An error occurred while loading books."></app-generic-error>
  }

  @if (!loading && !error) {
    <app-books-datatable
      [items]="items"
      [isLoading]="false"
      [hasError]="false"
      (create)="goToCreate()"
      (view)="goToDetails($event)"
      (update)="goToUpdate($event)"
      (delete)="askDelete($event)"
    ></app-books-datatable>

    <div class="flex justify-end mt-4">
      <app-generic-paginator
        [currentPage]="filter.page ?? 1"
        [totalPages]="totalPages"
        [maxVisible]="5"
        [totalItems]="total"
        [itemsPerPage]="filter.limit ?? 10"
        (pageChange)="onPageChange({ page: $event, limit: filter.limit ?? 10 })"
      ></app-generic-paginator>
    </div>
  }
</div>
