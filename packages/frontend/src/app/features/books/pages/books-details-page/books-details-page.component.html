@if (isLoading) {
  <div class="flex items-center justify-center py-12">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
  </div>
} @else if (book) {
  <div class="space-y-6">
    <button (click)="onBack()" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-gray-700">
      <i class="fas fa-arrow-left"></i> Back to Books
    </button>

    <div class="bg-white rounded-xl border border-gray-200 p-6">
      <div class="flex items-center gap-4">
        <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold text-2xl">
          {{ book.title.charAt(0).toUpperCase() }}
        </div>
        <div>
          <h1 class="text-2xl font-bold text-gray-900">{{ book.title }}</h1>
          <p class="text-gray-500 text-sm">Code: {{ book.code }}</p>
        </div>
      </div>
      @if (book.description) {
        <p class="mt-4 text-gray-600">{{ book.description }}</p>
      }
      <div class="mt-4 flex gap-2">
        <button (click)="onEdit()" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium">
          <i class="fas fa-edit mr-1"></i> Edit
        </button>
      </div>
    </div>
  </div>
}
